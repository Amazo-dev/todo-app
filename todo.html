<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <header>
            <h1>My Todo List</h1>
        <p>Abdulhamid- What do you need to do today?</p>
        </header>
        <section class="input-row">
            <input id="todoInput" type="text" placeholder="e.g Learn JavaScript">
            <button id="addBtn">Add</button>
        </section>
        <section>
            <ul id="todoList"></ul>
            <p id="total">Total: 0</p>
            <button id="clearBtn" class="clearAll">Clear All Done</button>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
